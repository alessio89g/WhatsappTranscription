services:
  whatsapp-transcription:
    build: .
    image: whatsapptranscription_image
    container_name: whatsapptranscription_container
    restart: always
    working_dir: /app
    volumes:
      - .:/app
      # Volume anonimo: protegge il node_modules dell'immagine dal bind mount
      # sopra. Senza questa riga il container userebbe il node_modules del
      # filesystem Windows e gli aggiornamenti di package.json non avrebbero
      # alcun effetto a runtime.
      - /app/node_modules
      # Sessione Baileys (le credenziali multi-device, in JSON)
      - ./Volumes/session_data:/app/session_data
      # Cache modelli HuggingFace (il modello di punteggiatura, ~2 GB)
      - ./Volumes/cache:/root/.cache
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      # I file audio temporanei vivono qui: in RAM, mai su disco
      - /tmp
    env_file:
      - .env
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"