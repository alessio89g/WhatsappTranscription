[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
user=root

; Il server di trascrizione parte per primo: caricare il modello di
; punteggiatura richiede alcuni secondi.
[program:python]
command=uvicorn server.app:app --host 127.0.0.1 --port 8000
directory=/app
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true

[program:node]
command=node index.js
directory=/app
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true